[project]
name = "incident-scout"
version = "0.1.0"
description = "A local incident detector for Prometheus/VictoriaMetrics, Loki, Alertmanager and Amazon CloudWatch: deterministic rules, deduplicated desktop and push notifications, backtests on history, and diagnoses by a local model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vladislav Barot", email = "vladislav.barot@gmail.com" }]
requires-python = ">=3.11"
keywords = ["monitoring", "alerting", "prometheus", "loki", "cloudwatch", "mcp", "observability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pyyaml>=6.0",
]

[project.scripts]
scout = "incident_scout.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[cloudwatch,ecs,logs]>=1.35",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_scout"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "C4", "PT", "PTH", "RUF", "S", "N", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["incident_scout"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
