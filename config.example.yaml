# window as $window. `promql`, `logql` and `cloudwatch` give a timeline, `logql_top` one total
# per series, `logs_insights` either (a timeline when it groups by bin()), and `ecs_events`
# the deployments and service events of the ECS cluster named by the query. A query runs
# only for incidents of rules on its source.
